services:
  escalator:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8090"
      DB_PATH: "/data/escalator.db"
    volumes:
      - escalator_data:/data
    ports:
      # Loopback only — front with nginx (or the existing reverse proxy).
      - "127.0.0.1:8090:8090"

volumes:
  escalator_data:
